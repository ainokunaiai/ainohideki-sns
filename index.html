<title>相野ひでき | SNS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Yu Gothic","Hiragino Sans",sans-serif;
  background:radial-gradient(circle at top,#2d2200 0%,#000 45%);
  color:white;
}
.container{max-width:700px;margin:auto;padding:40px 25px 70px;}
.profile{text-align:center;}
.profile img{
  width:260px;max-width:75%;aspect-ratio:1/1;object-fit:cover;object-position:center 18%;
  border-radius:50%;border:6px solid #d4af37;box-shadow:0 0 25px rgba(212,175,55,.5);
}
.name{margin-top:25px;font-size:68px;font-weight:900;letter-spacing:4px;color:#f6d26a;}
.catch{margin-top:18px;font-size:38px;line-height:1.6;font-weight:bold;}
.sns-area{margin-top:45px;}
.sns-btn{
  display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:white;
  padding:28px 30px;margin-bottom:24px;border-radius:28px;border:3px solid #d4af37;background:rgba(0,0,0,.65);
}
.left{display:flex;align-items:center;gap:28px;}
.icon-box{
  width:90px;height:90px;border-radius:24px;background:white;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.icon{width:62px;height:62px;object-fit:contain;display:block;}
.line-icon{width:66px;height:66px;border-radius:14px;}
.label{font-size:42px;font-weight:700;}
.arrow{font-size:60px;color:#d4af37;}
@media(max-width:700px){
  .name{font-size:52px;}
  .catch{font-size:28px;}
  .icon-box{width:72px;height:72px;}
  .icon{width:50px;height:50px;}
  .line-icon{width:52px;height:52px;}
  .label{font-size:32px;}
  .arrow{font-size:46px;}
  .sns-btn{padding:22px;}
}
</style>
